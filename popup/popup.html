<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackSnap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" fill="#2563EB"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" fill="#7C3AED"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" fill="#059669"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" fill="#DC2626" opacity="0.6"/>
          </svg>
          <span class="logo-text">StackSnap</span>
        </div>
        <span class="site-url" id="siteUrl">Loading...</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="copyBtn" title="Copy as Markdown">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="btn-icon" id="refreshBtn" title="Re-scan page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </header>

    <!-- State: Scanning -->
    <div class="state" id="stateScanning" style="display:none">
      <div class="spinner"></div>
      <p>Scanning tech stack…</p>
    </div>

    <!-- State: Results -->
    <div id="stateResults" style="display:none">
      <div class="summary-bar" id="summaryBar"></div>
      <div class="search-wrap">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Filter technologies…" autocomplete="off" spellcheck="false">
      </div>
      <div class="filter-tabs" id="filterTabs"></div>
      <div class="results-list" id="resultsList"></div>
    </div>

    <!-- State: No results -->
    <div class="state" id="stateEmpty" style="display:none">
      <p style="font-size:28px; margin-bottom: 8px;">🔍</p>
      <p class="state-title">Nothing detected</p>
      <p class="state-sub">This page uses custom or server-side tech we can't see from the browser.</p>
    </div>

    <!-- State: Error -->
    <div class="state" id="stateError" style="display:none">
      <p style="font-size:28px; margin-bottom: 8px;">⚠️</p>
      <p class="state-title">Can't scan this page</p>
      <p class="state-sub">Extensions can't run on chrome:// or browser system pages.</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>by <strong>Brilworks</strong></span>
      <a href="#" id="proLink" class="pro-badge">✨ Pro</a>
    </footer>
  </div>

  <script src="../data/signatures.js"></script>
  <script src="popup.js"></script>
</body>
</html>
